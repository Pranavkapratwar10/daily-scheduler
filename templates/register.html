{% extends "base.html" %}

{% block title %}
Register - Daily Scheduler
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            ✨
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Start organizing your day.
        </p>


        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="4"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn primary full"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
