{% extends "base.html" %}

{% block title %}
Login - Daily Scheduler
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            📅
        </div>

        <h1>
            Daily Scheduler
        </h1>

        <p class="subtitle">
            Organize your day. Get things done.
        </p>


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn primary full"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create account
            </a>

        </p>

    </div>

</div>

{% endblock %}
